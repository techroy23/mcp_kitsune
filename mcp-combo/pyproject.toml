[project]
name = "kitsune"
version = "0.1.0"
description = "kitsune MCP server - web research gateway (SearXNG search + Camoufox extract + docs search)."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "mcp>=2.0.0,<3",          # MCP SDK v2 (FastMCP removed in v2; use MCPServer)
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
kitsune = "kitsune.server:main"
kitsune-stdio = "kitsune.server:main_stdio_entry"